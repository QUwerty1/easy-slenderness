[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "DJ",   # flake8-django
]
# Line length is handled by the formatter
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["easy_slenderness"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
